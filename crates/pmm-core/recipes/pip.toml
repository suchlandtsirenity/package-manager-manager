name = "pip"
description = "Python's default installer (global/user installs)"
homepage = "https://pip.pypa.io"

[detect]
binary = "pip"
version = ["pip", "--version"]
owns = ["~/.local/lib/python*/site-packages"]

[list]
# User installs and anything forced into /usr/local with --break-system-packages,
# for every Python version, not just the current one (an OS upgrade leaves the
# old version's packages behind). Each line gets its folder appended so the
# Python version can be shown. Packages apt put in /usr/lib/python3 are apt's.
command = ["sh", "-c", "for d in \"$HOME\"/.local/lib/python3*/site-packages /usr/local/lib/python3*/dist-packages; do [ -d \"$d\" ] && pip list --path \"$d\" --format=freeze 2>/dev/null | sed \"s|\\$| $d|\"; done; true"]
pattern = '^(?P<name>[^=\s]+)==(?P<version>\S+)(?: .*/(?P<note>python[\d.]+)/)?'
watch = ["~/.local/lib/python*/site-packages", "/usr/local/lib/python*/dist-packages"]

[binaries]
builtin = "pip-scripts"

# No [update]: pip has no "upgrade all", and upgrading every package blindly
# breaks ones that pin each other's versions.

[[install]]
name = "apt"
manager = "apt"
commands = [["apt-get", "install", "-y", "python3-pip"]]
sudo = true
uninstall = [["apt-get", "remove", "python3-pip"]]

[remove]
# The current Python's user packages. Ones for other Python versions (left
# over from an OS upgrade) can't be uninstalled with this pip; they're still
# in the saved list.
commands = [["sh", "-c", "python3 -m pip freeze --user | sed 's/[=@ ].*//' | xargs -r python3 -m pip uninstall -y --break-system-packages"]]
note = "Packages for other Python versions and in /usr/local stay; `pmm list -m pip` shows them."

# No [install_pkg]: Ubuntu blocks `pip install` outside a venv (PEP 668).
# Restore pip packages with `pmm restore <list> --via pipx` (or uv).

# No [search_remote]: pip can't install here (PEP 668); pipx and uv search PyPI.
[info]
command = ["python3", "-c", '''
import json, sys, urllib.request, urllib.error
try:
    info = json.load(urllib.request.urlopen("https://pypi.org/pypi/" + sys.argv[1] + "/json", timeout=20))["info"]
except urllib.error.HTTPError as e:
    sys.exit("not on PyPI" if e.code == 404 else str(e))
print(info["name"], info["version"])
print(info.get("summary") or "")
urls = info.get("project_urls") or {}
home = info.get("home_page") or urls.get("Homepage") or urls.get("Source") or ""
for label, value in [("homepage", home), ("license", info.get("license_expression") or ""), ("requires python", info.get("requires_python") or "")]:
    if value and len(value) < 200:
        print(f"{label}: {value}")
''', "{package}"]

[remove_pkg]
# Only the current Python's packages: pip can't uninstall for a Python that's
# gone (leftovers from an OS upgrade), and would just say "skipping".
command = ["sh", "-c", "if python3 -m pip show -q \"$1\" 2>/dev/null; then python3 -m pip uninstall -y --break-system-packages \"$1\"; else echo \"$1 isn't installed for $(python3 --version), so this pip can't remove it (it belongs to another Python version)\" >&2; exit 1; fi", "sh", "{package}"]
