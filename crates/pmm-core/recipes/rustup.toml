name = "rustup"
description = "Rust toolchain installer"
homepage = "https://rustup.rs"

[detect]
binary = "rustup"
version = ["rustup", "--version"]
# Its own binary is listed so it beats cargo's ~/.cargo/bin; rustc, cargo
# etc. in ~/.cargo/bin are links to it.
owns = ["~/.cargo/bin/rustup", "~/.rustup"]

[list]
command = ["rustup", "toolchain", "list"]
pattern = '^(?P<name>\S+)(?: \((?P<note>[^)]*)\))?'
items = "toolchains"
watch = ["~/.rustup/toolchains"]

[update]
commands = [["rustup", "update"]]

[[install]]
name = "official"
commands = [["sh", "-c", "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"]]
# Removes every toolchain and everything `cargo install`ed (~/.cargo, ~/.rustup)
# and its own lines in shell profiles.
uninstall = [["rustup", "self", "uninstall", "-y"]]

[install_pkg]
command = ["rustup", "toolchain", "install", "{package}"]

[remove_pkg]
command = ["rustup", "toolchain", "uninstall", "{package}"]

[upgrade_pkg]
command = ["rustup", "update", "{package}"]

[outdated]
# Toolchains only: the "rustup - Update available" line is rustup itself.
command = ["rustup", "check"]
pattern = '^(?P<name>\S+-\S+) - [Uu]pdate available\s*:\s*(?P<version>\S+).* -> (?P<latest>\S+)'
