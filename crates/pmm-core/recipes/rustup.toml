name = "rustup"
description = "Rust toolchain installer"
homepage = "https://rustup.rs"

[detect]
binary = "rustup"
version = ["rustup", "--version"]
owns = ["~/.cargo/bin", "~/.rustup"]

[list]
command = ["rustup", "toolchain", "list"]
pattern = '^(?P<name>\S+)(?: \((?P<note>[^)]*)\))?'
items = "toolchains"
watch = ["~/.rustup/toolchains"]
