name = "rustup"
description = "Rust toolchain installer"
homepage = "https://rustup.rs"

[detect]
binary = "rustup"
version = ["rustup", "--version"]
# Its own binary is listed so it beats cargo's ~/.cargo/bin; rustc, cargo
# etc. in ~/.cargo/bin are links to it.
owns = ["~/.cargo/bin/rustup", "~/.rustup"]

[list]
command = ["rustup", "toolchain", "list"]
pattern = '^(?P<name>\S+)(?: \((?P<note>[^)]*)\))?'
items = "toolchains"
watch = ["~/.rustup/toolchains"]

[update]
commands = [["rustup", "update"]]
