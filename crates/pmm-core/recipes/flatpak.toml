name = "flatpak"
description = "Sandboxed desktop apps"
homepage = "https://flatpak.org"

[detect]
binary = "flatpak"
version = ["flatpak", "--version"]
owns = ["/var/lib/flatpak", "~/.local/share/flatpak"]

[list]
command = ["flatpak", "list", "--app", "--columns=application,version,name"]
pattern = '^(?P<name>[^\t]+)\t(?P<version>[^\t]*)\t(?P<title>.*)$'
watch = ["/var/lib/flatpak/app", "/var/lib/flatpak/app/*", "~/.local/share/flatpak/app", "~/.local/share/flatpak/app/*"]

[binaries]
glob = ["/var/lib/flatpak/exports/bin/{package}", "~/.local/share/flatpak/exports/bin/{package}"]

[update]
# Updates both user and system installs; flatpak asks polkit itself when needed.
commands = [["flatpak", "update", "-y"]]

[[install]]
name = "apt"
manager = "apt"
commands = [["apt-get", "install", "-y", "flatpak"]]
sudo = true
uninstall = [["apt-get", "remove", "flatpak"]]

[remove]
commands = [["flatpak", "uninstall", "--all", "-y"]]
note = "App data in ~/.var/app is kept; delete it yourself if you don't want it."

[install_pkg]
command = ["flatpak", "install", "-y", "--system", "flathub", "{package}"]

[search_remote]
command = ["flatpak", "search", "--columns=application,version,name,description", "{query}"]
pattern = '^(?P<name>[^\t]+)\t(?P<version>[^\t]*)\t(?P<title>[^\t]*)\t(?P<description>.*)$'

[info]
# --system: flathub is often set up both system-wide and per user, and
# flatpak would stop to ask which.
command = ["flatpak", "remote-info", "--system", "flathub", "{package}"]

[remove_pkg]
command = ["flatpak", "uninstall", "-y", "{package}"]

[upgrade_pkg]
command = ["flatpak", "update", "-y", "{package}"]

[outdated]
# Apps and runtimes, from every installation; the version is the new one.
command = ["flatpak", "remote-ls", "--updates", "--columns=application,version"]
pattern = '^(?P<name>[^\s.]+\.[^\t\s]+)(?:\t(?P<latest>[^\t]*))?$'
