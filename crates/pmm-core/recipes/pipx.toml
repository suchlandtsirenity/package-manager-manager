name = "pipx"
description = "Python CLI tools, each in its own venv"
homepage = "https://pipx.pypa.io"

[detect]
binary = "pipx"
version = ["pipx", "--version"]
owns = ["~/.local/share/pipx"]

[list]
command = ["pipx", "list", "--short"]
pattern = '^(?P<name>\S+) (?P<version>\S+)'
watch = ["~/.local/share/pipx/venvs", "~/.local/share/pipx/venvs/*/pipx_metadata.json"]

[binaries]
builtin = "pipx-apps"
