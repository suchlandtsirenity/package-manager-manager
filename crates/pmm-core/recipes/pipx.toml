name = "pipx"
description = "Python CLI tools, each in its own venv"
homepage = "https://pipx.pypa.io"

[detect]
binary = "pipx"
version = ["pipx", "--version"]
owns = ["~/.local/share/pipx"]

[list]
command = ["pipx", "list", "--short"]
pattern = '^(?P<name>\S+) (?P<version>\S+)'
watch = ["~/.local/share/pipx/venvs", "~/.local/share/pipx/venvs/*/pipx_metadata.json"]

[binaries]
builtin = "pipx-apps"

[update]
commands = [["pipx", "upgrade-all"]]

[[install]]
name = "apt"
manager = "apt"
commands = [["apt-get", "install", "-y", "pipx"]]
sudo = true
uninstall = [["apt-get", "remove", "pipx"]]

[[install]]
name = "brew"
manager = "brew"
commands = [["brew", "install", "pipx"]]
uninstall = [["brew", "uninstall", "pipx"]]

[remove]
commands = [["pipx", "uninstall-all"]]

[install_pkg]
command = ["pipx", "install", "{package}"]

[search_remote]
# PyPI has no search API: this looks up the exact name only.
command = ["python3", "-c", '''
import json, sys, urllib.request, urllib.error
try:
    info = json.load(urllib.request.urlopen("https://pypi.org/pypi/" + sys.argv[1] + "/json", timeout=20))["info"]
except urllib.error.HTTPError as e:
    if e.code == 404:
        sys.exit(0)
    raise
print(info["name"], info["version"], (info.get("summary") or "").replace("\t", " "), sep="\t")
''', "{query}"]
pattern = '^(?P<name>[^\t]+)\t(?P<version>[^\t]*)\t(?P<description>.*)$'
exact = true

[info]
command = ["python3", "-c", '''
import json, sys, urllib.request, urllib.error
try:
    info = json.load(urllib.request.urlopen("https://pypi.org/pypi/" + sys.argv[1] + "/json", timeout=20))["info"]
except urllib.error.HTTPError as e:
    sys.exit("not on PyPI" if e.code == 404 else str(e))
print(info["name"], info["version"])
print(info.get("summary") or "")
urls = info.get("project_urls") or {}
home = info.get("home_page") or urls.get("Homepage") or urls.get("Source") or ""
for label, value in [("homepage", home), ("license", info.get("license_expression") or ""), ("requires python", info.get("requires_python") or "")]:
    if value and len(value) < 200:
        print(f"{label}: {value}")
''', "{package}"]

[remove_pkg]
command = ["pipx", "uninstall", "{package}"]

[upgrade_pkg]
command = ["pipx", "upgrade", "{package}"]

[outdated]
# pipx has no "outdated": ask PyPI about each app, a few at a time.
command = ["python3", "-c", '''
import json, subprocess, sys, urllib.request
from concurrent.futures import ThreadPoolExecutor
listed = subprocess.run(["pipx", "list", "--short"], capture_output=True, text=True, check=True).stdout
installed = [line.split()[:2] for line in listed.splitlines() if len(line.split()) >= 2]
def latest(name):
    try:
        return json.load(urllib.request.urlopen("https://pypi.org/pypi/" + name + "/json", timeout=20))["info"]["version"]
    except Exception as e:
        return e
with ThreadPoolExecutor(8) as pool:
    answers = list(pool.map(lambda p: latest(p[0]), installed))
errors = [a for a in answers if isinstance(a, Exception)]
if installed and len(errors) == len(installed):
    sys.exit(f"can't reach PyPI: {errors[0]}")
for (name, version), new in zip(installed, answers):
    if isinstance(new, str) and new != version:
        print(name, version, new, sep="\t")
''']
pattern = '^(?P<name>[^\t]+)\t(?P<version>[^\t]+)\t(?P<latest>[^\t]+)$'
