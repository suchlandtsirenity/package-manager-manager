name = "pipx"
description = "Python CLI tools, each in its own venv"
homepage = "https://pipx.pypa.io"

[detect]
binary = "pipx"
version = ["pipx", "--version"]
owns = ["~/.local/share/pipx"]

[list]
command = ["pipx", "list", "--short"]
pattern = '^(?P<name>\S+) (?P<version>\S+)'
watch = ["~/.local/share/pipx/venvs", "~/.local/share/pipx/venvs/*/pipx_metadata.json"]

[binaries]
builtin = "pipx-apps"

[update]
commands = [["pipx", "upgrade-all"]]

[[install]]
name = "apt"
manager = "apt"
commands = [["apt-get", "install", "-y", "pipx"]]
sudo = true
uninstall = [["apt-get", "remove", "pipx"]]

[[install]]
name = "brew"
manager = "brew"
commands = [["brew", "install", "pipx"]]
uninstall = [["brew", "uninstall", "pipx"]]

[remove]
commands = [["pipx", "uninstall-all"]]

[install_pkg]
command = ["pipx", "install", "{package}"]
