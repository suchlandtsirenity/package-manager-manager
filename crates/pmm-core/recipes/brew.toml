name = "brew"
description = "Homebrew on Linux"
homepage = "https://brew.sh"

[detect]
binary = "brew"
version = ["brew", "--version"]
owns = ["/home/linuxbrew/.linuxbrew", "~/.linuxbrew"]

[list]
command = ["brew", "list", "--versions"]
pattern = '^(?P<name>\S+) (?P<version>\S+)'
watch = ["/home/linuxbrew/.linuxbrew/Cellar", "/home/linuxbrew/.linuxbrew/Cellar/*", "/home/linuxbrew/.linuxbrew/Caskroom"]

[binaries]
glob = ["/home/linuxbrew/.linuxbrew/Cellar/{package}/*/bin/*", "/home/linuxbrew/.linuxbrew/Cellar/{package}/*/sbin/*"]

[update]
commands = [["brew", "update"], ["brew", "upgrade"]]

[[install]]
name = "official"
commands = [["bash", "-c", "NONINTERACTIVE=1 bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\""]]
# The uninstaller removes every formula and cask along with brew.
uninstall = [["bash", "-c", "NONINTERACTIVE=1 bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh)\""]]

[remove]
note = "Delete the `brew shellenv` line from ~/.bashrc (or ~/.profile)."

[install_pkg]
command = ["brew", "install", "{package}"]
