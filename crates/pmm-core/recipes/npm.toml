name = "npm"
description = "Node.js packages (global installs)"
homepage = "https://www.npmjs.com"

[detect]
binary = "npm"
version = ["npm", "--version"]
owns = ["~/.nvm/versions/node/*/lib/node_modules", "/usr/lib/node_modules", "/usr/local/lib/node_modules"]

[list]
# Reads global node_modules for every Node version under nvm, not just the active one.
builtin = "npm-globals"
watch = ["~/.nvm/versions/node", "~/.nvm/versions/node/*/lib/node_modules", "/usr/lib/node_modules", "/usr/local/lib/node_modules"]

[binaries]
builtin = "npm-bins"

[update]
# Only the active Node version's globals (under nvm, each version has its own).
commands = [["npm", "update", "-g"]]

# Under nvm, npm comes with each Node version; `pmm remove nvm` removes both.
[[install]]
name = "nvm"
manager = "nvm"
commands = [["bash", "-c", ". \"$HOME/.nvm/nvm.sh\" && nvm install --lts"]]

[[install]]
name = "apt"
manager = "apt"
commands = [["apt-get", "install", "-y", "npm"]]
sudo = true
uninstall = [["apt-get", "remove", "npm"]]

[remove]
# Global packages of the system Node (in /usr/local, hence sudo), except npm itself.
commands = [["sh", "-c", "npm ls -g --depth=0 --parseable | tail -n +2 | sed 's|.*/node_modules/||' | grep -vxE 'npm|corepack' | xargs -r npm uninstall -g"]]
sudo = true

[install_pkg]
command = ["npm", "install", "-g", "{package}"]

[search_remote]
# name, description, [author,] date, version, keywords
command = ["npm", "search", "--parseable", "{query}"]
pattern = '^(?P<name>[^\t]+)\t(?P<description>[^\t]*)\t.*\t(?P<version>[^\t]+)\t[^\t]*$'

[info]
command = ["npm", "view", "{package}"]

[remove_pkg]
command = ["npm", "uninstall", "-g", "{package}"]

[upgrade_pkg]
command = ["npm", "install", "-g", "{package}@latest"]
