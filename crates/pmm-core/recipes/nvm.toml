name = "nvm"
description = "Node.js version manager"
homepage = "https://github.com/nvm-sh/nvm"

[detect]
path = "~/.nvm/nvm.sh"
version = ["bash", "-c", "source ~/.nvm/nvm.sh && nvm --version"]
# npm and corepack come bundled with each Node version.
owns = ["~/.nvm", "~/.nvm/versions/node/*/lib/node_modules/npm", "~/.nvm/versions/node/*/lib/node_modules/corepack"]

[list]
builtin = "nvm"
items = "Node versions"
watch = ["~/.nvm/versions/node"]

# No [update]: a newer Node is a new install alongside the old ones
# (`nvm install --lts --reinstall-packages-from=current`), not an update.
