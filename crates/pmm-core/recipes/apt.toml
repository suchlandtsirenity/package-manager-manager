name = "apt"
description = "Debian/Ubuntu system packages"
homepage = "https://wiki.debian.org/Apt"
protected = true

[detect]
binary = "apt"
version = ["apt", "--version"]
# Not /usr/local: that's for things installed by hand (or by pip).
owns = ["/usr/bin", "/usr/sbin", "/usr/lib", "/usr/libexec", "/usr/share", "/usr/games", "/bin", "/sbin", "/lib", "/lib64"]

[list]
command = ["dpkg-query", "-W", "-f", "${db:Status-Abbrev}\t${Package}\t${Version}\n"]
# "ii" = installed, "hi" = installed and held; "rc" (removed, config left) is skipped.
pattern = '^[ih]i\s*\t(?P<name>[^\t]+)\t(?P<version>.*)$'
watch = ["/var/lib/dpkg/status"]

[binaries]
command = ["dpkg", "-L", "{package}"]
pattern = '^/(?:usr/)?(?:s?bin|games)/(?P<name>[^/]+)$'

[update]
# apt-get rather than apt: apt warns that its output isn't stable for scripts.
# --with-new-pkgs lets upgrades pull in new dependencies, like `apt upgrade`.
commands = [["apt-get", "update"], ["apt-get", "-y", "--with-new-pkgs", "upgrade"]]
sudo = true

[install_pkg]
command = ["apt-get", "install", "-y", "{package}"]
sudo = true

[search_remote]
command = ["apt-cache", "search", "--names-only", "{query}"]
pattern = '^(?P<name>\S+) - (?P<description>.*)$'

[info]
# The fields people care about, and the description (its indented lines).
command = ["sh", "-c", "apt-cache show --no-all-versions \"$1\" | grep -E '^(Package|Version|Section|Homepage|Installed-Size|Description(-en)?):|^ '", "sh", "{package}"]

[remove_pkg]
# No -y: apt shows what else would be removed and asks.
command = ["apt-get", "remove", "{package}"]
sudo = true

[upgrade_pkg]
command = ["apt-get", "install", "--only-upgrade", "-y", "{package}"]
sudo = true
