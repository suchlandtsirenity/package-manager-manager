name = "uv"
description = "Fast Python package and project manager"
homepage = "https://docs.astral.sh/uv"

[detect]
binary = "uv"
version = ["uv", "--version"]
owns = ["~/.local/share/uv"]

[list]
command = ["uv", "tool", "list"]
# "ruff v0.5.0"; the indented "- ruff" lines under it are its commands.
pattern = '^(?P<name>[^\s-]\S*) v(?P<version>\S+)'
watch = ["~/.local/share/uv/tools", "~/.local/share/uv/tools/*/uv-receipt.toml"]

[binaries]
builtin = "uv-tools"

[update]
commands = [["uv", "tool", "upgrade", "--all"]]

[[install]]
name = "official"
commands = [["sh", "-c", "curl -LsSf https://astral.sh/uv/install.sh | sh"]]
# Following uv's own uninstall steps: clear the cache, then delete the
# binaries and data (below).
uninstall = [["uv", "cache", "clean"]]

[[install]]
name = "brew"
manager = "brew"
commands = [["brew", "install", "uv"]]
uninstall = [["brew", "uninstall", "uv"]]

[[install]]
name = "pipx"
manager = "pipx"
commands = [["pipx", "install", "uv"]]
uninstall = [["pipx", "uninstall", "uv"]]

[remove]
commands = [["uv", "tool", "uninstall", "--all"]]
# Its tools, the Pythons it installed, and (for the official installer) itself.
paths = ["~/.local/share/uv", "~/.local/bin/uv", "~/.local/bin/uvx"]

[install_pkg]
command = ["uv", "tool", "install", "{package}"]

[search_remote]
# PyPI has no search API: this looks up the exact name only.
command = ["python3", "-c", '''
import json, sys, urllib.request, urllib.error
try:
    info = json.load(urllib.request.urlopen("https://pypi.org/pypi/" + sys.argv[1] + "/json", timeout=20))["info"]
except urllib.error.HTTPError as e:
    if e.code == 404:
        sys.exit(0)
    raise
print(info["name"], info["version"], (info.get("summary") or "").replace("\t", " "), sep="\t")
''', "{query}"]
pattern = '^(?P<name>[^\t]+)\t(?P<version>[^\t]*)\t(?P<description>.*)$'
exact = true

[info]
command = ["python3", "-c", '''
import json, sys, urllib.request, urllib.error
try:
    info = json.load(urllib.request.urlopen("https://pypi.org/pypi/" + sys.argv[1] + "/json", timeout=20))["info"]
except urllib.error.HTTPError as e:
    sys.exit("not on PyPI" if e.code == 404 else str(e))
print(info["name"], info["version"])
print(info.get("summary") or "")
urls = info.get("project_urls") or {}
home = info.get("home_page") or urls.get("Homepage") or urls.get("Source") or ""
for label, value in [("homepage", home), ("license", info.get("license_expression") or ""), ("requires python", info.get("requires_python") or "")]:
    if value and len(value) < 200:
        print(f"{label}: {value}")
''', "{package}"]

[remove_pkg]
command = ["uv", "tool", "uninstall", "{package}"]

[upgrade_pkg]
command = ["uv", "tool", "upgrade", "{package}"]

[outdated]
# "ruff v0.5.0 [latest: 0.6.1]"
command = ["uv", "tool", "list", "--outdated"]
pattern = '^(?P<name>[^\s-]\S*) v(?P<version>\S+) \[latest: (?P<latest>[^\]]+)\]'
