name = "uv"
description = "Fast Python package and project manager"
homepage = "https://docs.astral.sh/uv"

[detect]
binary = "uv"
version = ["uv", "--version"]
owns = ["~/.local/share/uv"]

[list]
command = ["uv", "tool", "list"]
# "ruff v0.5.0"; the indented "- ruff" lines under it are its commands.
pattern = '^(?P<name>[^\s-]\S*) v(?P<version>\S+)'
watch = ["~/.local/share/uv/tools", "~/.local/share/uv/tools/*/uv-receipt.toml"]

[binaries]
builtin = "uv-tools"

[update]
commands = [["uv", "tool", "upgrade", "--all"]]

[[install]]
name = "official"
commands = [["sh", "-c", "curl -LsSf https://astral.sh/uv/install.sh | sh"]]
# Following uv's own uninstall steps: clear the cache, then delete the
# binaries and data (below).
uninstall = [["uv", "cache", "clean"]]

[[install]]
name = "brew"
manager = "brew"
commands = [["brew", "install", "uv"]]
uninstall = [["brew", "uninstall", "uv"]]

[[install]]
name = "pipx"
manager = "pipx"
commands = [["pipx", "install", "uv"]]
uninstall = [["pipx", "uninstall", "uv"]]

[remove]
commands = [["uv", "tool", "uninstall", "--all"]]
# Its tools, the Pythons it installed, and (for the official installer) itself.
paths = ["~/.local/share/uv", "~/.local/bin/uv", "~/.local/bin/uvx"]

[install_pkg]
command = ["uv", "tool", "install", "{package}"]
