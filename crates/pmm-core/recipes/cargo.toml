name = "cargo"
description = "Rust packages (cargo install)"
homepage = "https://doc.rust-lang.org/cargo"

[detect]
binary = "cargo"
version = ["cargo", "--version"]
owns = ["~/.cargo/bin"]

[list]
command = ["cargo", "install", "--list"]
# "ripgrep v14.1.0:" or "foo v0.1.0 (/path/to/src):"; indented lines are its binaries.
pattern = '^(?P<name>\S+) v(?P<version>[^\s:]+)(?: \((?P<note>[^)]*)\))?:?$'
watch = ["~/.cargo/.crates2.json", "~/.cargo/.crates.toml"]

[binaries]
builtin = "cargo-bins"

[update]
# cargo has no "upgrade all". Use cargo-update if it's installed; otherwise
# reinstall each crates.io package, which cargo skips when it's up to date.
# Packages installed from a path or git (with a "(…)" after the version) are left alone.
commands = [["sh", "-c", "if command -v cargo-install-update >/dev/null; then cargo install-update -a; else cargo install --list | sed -n 's/^\\([^ ]*\\) v[^ ]*:$/\\1/p' | xargs -r -n1 cargo install; fi"]]

# cargo comes with rustup's toolchains; `pmm remove rustup` removes both.
[[install]]
name = "rustup"
manager = "rustup"
commands = [["rustup", "default", "stable"]]

[[install]]
name = "apt"
manager = "apt"
commands = [["apt-get", "install", "-y", "cargo"]]
sudo = true
uninstall = [["apt-get", "remove", "cargo"]]

[remove]
# Every installed crate, including ones from a path or git.
commands = [["sh", "-c", "cargo install --list | sed -n 's/^\\([^ ]*\\) v.*:$/\\1/p' | xargs -r cargo uninstall"]]

[install_pkg]
command = ["cargo", "install", "{package}"]

[search_remote]
command = ["cargo", "search", "{query}", "--limit", "25"]
pattern = '^(?P<name>\S+) = "(?P<version>[^"]+)"\s*(?:# (?P<description>.*))?$'

[info]
command = ["cargo", "info", "{package}"]

[remove_pkg]
command = ["cargo", "uninstall", "{package}"]

[upgrade_pkg]
# Reinstalls only if a newer version exists.
command = ["cargo", "install", "{package}"]

[outdated]
# cargo has no "outdated": ask crates.io about each crates.io package.
command = ["sh", "-c", "cargo install --list | sed -n 's/^\\([^ ]*\\) v\\([^ ]*\\):$/\\1 \\2/p' | while read -r n v; do l=$(cargo search \"$n\" --limit 1 | sed -n \"s/^$n = \\\"\\([^\\\"]*\\)\\\".*/\\1/p\"); [ -n \"$l\" ] && [ \"$l\" != \"$v\" ] && printf '%s\\t%s\\t%s\\n' \"$n\" \"$v\" \"$l\"; done; true"]
pattern = '^(?P<name>[^\t]+)\t(?P<version>[^\t]+)\t(?P<latest>[^\t]+)$'
